name: Migration Version Check

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - mitchwork

jobs:
  migration-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexusbot
          POSTGRES_PASSWORD: nexusbot
          POSTGRES_DB: nexusbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusbot -d nexusbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URL: postgresql://nexusbot:nexusbot@localhost:5432/nexusbot
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: nexusbot
      POSTGRES_USER: nexusbot
      POSTGRES_PASSWORD: nexusbot
      POSTGRES_SSL: "false"
      SCHEMA_VERSION: "1"
      SCHEMA_VERSION_LABEL: "baseline-v1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Apply migrations
        run: npm run migrate

      - name: Validate migration version
        run: npm run migrate:check
